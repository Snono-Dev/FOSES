<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FOSES | نظّم دراستك</title>
<meta name="description" content="منصة شخصية مجانية لتنظيم الدراسة: مواد، دروس، امتحانات، مؤقت، تقويم، XP — بياناتك في GitHub Repo خاص بك.">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="./css/styles.css?v=68">
</head>
<body>
<div id="splash">
  <img class="splash-logo-img" src="./assets/icons/icon-512.png" alt="FOSES">
  <div class="splash-tag">نظام الدراسة المفتوح</div>
  <div class="splash-bar"><span></span></div>
</div>

<header id="topbar">
  <button id="menuBtn" class="icon-btn" aria-label="القائمة"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <div class="brand"><img class="brand-logo" src="./assets/icons/icon-192.png" alt="FOSES"><span class="brand-name">FOSES</span>
    <span id="syncDot" class="sync-dot" title="حالة المزامنة">●</span>
  </div>
  <div class="top-actions">
    <a id="bellBtn" class="icon-btn" href="#/reminders" aria-label="التنبيهات" style="text-decoration:none;position:relative"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span id="bellDot" class="hidden" style="position:absolute;top:2px;inset-inline-end:2px;min-width:16px;height:16px;border-radius:99px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px"></span></a>
    <button id="themeBtn" class="icon-btn" aria-label="الوضع"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18V3z" fill="currentColor" stroke="none"/></svg></button>
    <img id="avatar" class="avatar hidden" alt="avatar">
  </div>
</header>

<div id="layout">
  <aside id="sidebar">
    <nav id="sideNav"></nav>
    <div class="side-foot">
      <div id="xpMini" class="xp-mini"></div>
      <div class="side-motto">تعلّم. تتبّع. امتلك.</div>
      <button id="installBtn" class="btn ghost hidden">⬇️ تثبيت التطبيق</button>
    </div>
  </aside>
  <main id="app" tabindex="-1"></main>
</div>

<nav id="bottomNav"></nav>
<div id="toasts"></div>
<div id="modalRoot"></div>

<script>
window.__fosesErr=null;
window.addEventListener('error',function(e){try{window.__fosesErr=String(e.message||e.type||'script-error')}catch{}},true);
window.addEventListener('unhandledrejection',function(e){try{window.__fosesErr='promise: '+String((e.reason&&e.reason.message)||e.reason)}catch{}});
if (location.protocol === 'file:') {
  document.write('<div style="background:#7f1d1d;color:#fff;padding:12px;text-align:center;font-weight:700">⚠️ لا تفتح الملف بالنقر المزدوج — شغّل سيرفرًا محليًا ثم افتح http://localhost:8080 — انظر README</div>');
}
setTimeout(function(){
  var app=document.getElementById('app');
  if(app && !app.innerHTML){
    var err=window.__fosesErr?'<br><br>🔍 الخطأ الفعلي: <span class="kbd" dir="ltr">'+window.__fosesErr+'</span>':'';
    app.innerHTML='<div class="card">⚠️ تعذّر تحميل التطبيق. الأسباب الشائعة:<br>1) فتحت الملف مباشرة (file://) — استخدم سيرفرًا محليًا ثم افتح <b>http://127.0.0.1:8080</b><br>2) عطّل مانع الإعلانات للصفحة المحلية.<br>3) استخدم متصفحًا حديثًا (Chrome/Edge).'+err+'</div>';
    var sp=document.getElementById('splash'); if(sp) sp.classList.add('done');
  }
},6000);
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
<script type="module" src="./js/app.js?v=68"></script>
</body>
</html>
